spring.application.name=book-shopping-app
server.port=8081
spring.config.import=optional:file:./config/application-secrets.properties
spring.profiles.default=dev
# Development
#spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
# H2 database configuration
spring.datasource.url=jdbc:h2:mem:bookstoredb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.payment.mock.webhook-secret=test-webhook-secret-at-least-32-characters
