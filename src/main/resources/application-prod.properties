# Production database settings must be supplied by the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production must use managed schema migrations; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Never expose the H2 console in production.
spring.h2.console.enabled=false

# PAYMENT_WEBHOOK_SECRET is required by MockWebhookVerifier at startup.
