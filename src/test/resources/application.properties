# Test-only defaults. Never package this file into the production artifact.
spring.datasource.url=jdbc:h2:mem:bookstore-tests;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
spring.h2.console.enabled=false
# Test-only webhook secret
app.payment.mock.webhook-secret=test-webhook-secret-at-least-32-characters
