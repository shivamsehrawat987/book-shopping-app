spring.application.name=book-shopping-app
server.port=8081

# Optional local-only credentials; this file is ignored by Git.
spring.config.import=optional:file:./config/application-secrets.properties

# Keep shared settings here. Environment-specific settings live in profile files.
# Set SPRING_PROFILES_ACTIVE=dev locally or prod in a deployment.
spring.jpa.open-in-view=false

# Never commit the webhook secret. Set PAYMENT_WEBHOOK_SECRET in the environment.
# MockWebhookVerifier rejects an empty or weak value at application startup.
app.payment.mock.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
